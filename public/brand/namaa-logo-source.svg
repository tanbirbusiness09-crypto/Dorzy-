<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Blue Ring -->
  <circle cx="100" cy="100" r="95" fill="#1e3a8a" />
  
  <!-- Content Area (White background for text) -->
  <circle cx="100" cy="100" r="80" fill="white" />
  
  <!-- Inner Black Circle -->
  <circle cx="100" cy="100" r="55" fill="black" />

  <!-- Arabic Text in Center -->
  <text x="50%" y="50%" text-anchor="middle" fill="white" font-family="'Amiri', serif" font-size="45" dy=".35em">نماء</text>
  
  <!-- English Circular Text -->
  <defs>
    <path id="circlePath" d="M 100, 100 m -68, 0 a 68,68 0 1,1 136,0 a 68,68 0 1,1 -136,0" />
  </defs>
  <text fill="#000" font-family="'Outfit', sans-serif" font-size="17" font-weight="900">
    <textPath href="#circlePath" startOffset="0%" textLength="424" lengthAdjust="spacing">NAMAA AL QIMMAH GENTS TAILOR • </textPath>
  </text>
</svg>
